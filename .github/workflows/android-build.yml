name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle --no-daemon assembleDebug :cameratest:assembleDebug

      - name: Upload VirtualCamera APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamera-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Camera2 test APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera2Test-debug
          path: cameratest/build/outputs/apk/debug/cameratest-debug.apk
