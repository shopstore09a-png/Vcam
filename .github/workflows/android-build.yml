name: VirtualCamera and CamSwap Build

on:
  workflow_dispatch:
  push:
    branches:
      - camswap-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VirtualCamera
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build VirtualCamera
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble VirtualCamera APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Checkout CamSwap v2.8
        uses: actions/checkout@v4
        with:
          repository: zensu357/Android-CamSwap-OpenSource
          ref: v2.8
          path: camswap-src
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CamSwap SDK and native tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Assemble CamSwap APK
        working-directory: camswap-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamera-and-CamSwap-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            camswap-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
